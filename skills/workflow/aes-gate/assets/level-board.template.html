<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AES-QG Gate Board</title>
  <style>
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--rule:#d9dbe1;--accent:#eb6c36;--tint:#fdf1ec;--ok:#2f6f52;--warn:#996b18;--bad:#8c3a2b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    main{max-width:1180px;margin:0 auto;padding:40px 32px 56px}h1{font-size:28px;margin:0 0 8px;font-weight:650}.lede{color:var(--muted);margin:0 0 28px}
    .summary{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;margin-bottom:24px}.card{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:16px}.label{font:11px ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}.value{font-size:20px;font-weight:650;margin-top:6px}.accent{border-color:var(--accent);background:var(--tint)}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule)}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafafa}.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:3px 8px;font-size:12px}.pass{color:var(--ok);border-color:#a8c9b8;background:#f0f7f3}.blocked{color:var(--warn);border-color:#d9c18e;background:#fff9e9}.fail{color:var(--bad);border-color:#d8a79c;background:#fbeeea}.muted{color:var(--soft)}
    .note{margin-top:20px;padding:16px;border-left:3px solid var(--accent);background:var(--tint)}
  </style>
</head>
<body><main>
  <h1>AES-QG Gate Board</h1>
  <p class="lede">完整 namespace、累计等级与发布策略分离。任何 PASS 都绑定 candidate 与 policy identity。candidate=<span class="mono"><!--PROJECT--></span></p>
  <section class="summary">
    <div class="card"><div class="label">standard</div><div class="value mono"><!--STANDARD--></div></div>
    <div class="card"><div class="label">supported</div><div class="value"><!--SUPPORTED--></div></div>
    <div class="card accent"><div class="label">achieved</div><div class="value"><!--ACHIEVED--></div></div>
    <div class="card"><div class="label">release</div><div class="value"><!--RELEASE--></div></div>
  </section>
  <table aria-label="Gate level status">
    <thead><tr><th>Action</th><th>客观边界</th><th>本 candidate</th><th>执行</th><th>Identity</th></tr></thead>
    <tbody>
      <!--LEVELS-->
    </tbody>
  </table>
  <div class="note"><!--NOTE--></div>
</main></body></html>
