agent: Explore
tests:
  - name: 禁止二级派发
    check_type: flag_absent
    value: hasNestedDispatch
    severity: critical

  - name: 禁止写文件
    check_type: flag_absent
    value: hasFileWrites
    severity: critical

  - name: 禁止直接问用户
    check_type: flag_absent
    value: hasAskQuestions
    severity: critical

  - name: 不应使用 run_in_terminal
    check_type: trace_no_tool
    value: run_in_terminal
    severity: high

  - name: 不应使用 kill_terminal
    check_type: trace_no_tool
    value: kill_terminal
    severity: critical

  - name: 日志大小不超过 5MB
    check_type: log_size_max
    value: 5120
    severity: medium

  - name: 应使用文件读取工具
    check_type: trace_has_tool
    value: read_file
    severity: low
