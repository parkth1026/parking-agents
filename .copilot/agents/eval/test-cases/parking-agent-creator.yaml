agent: Parking Agent Creator
tests:
  - name: 禁止二级派发
    check_type: flag_absent
    value: hasNestedDispatch
    severity: critical

  - name: 禁止直接问用户
    check_type: flag_absent
    value: hasAskQuestions
    severity: critical

  - name: 不应使用 run_in_terminal
    check_type: trace_no_tool
    value: run_in_terminal
    severity: high

  - name: 输出应提及产出文件
    check_type: output_regex
    value: "\.agent\.md|\.prompt\.md|\.instructions\.md|SKILL\.md|create_file|replace_string|修改|创建|文件"
    severity: medium

  - name: 日志大小不超过 3MB
    check_type: log_size_max
    value: 3072
    severity: medium
