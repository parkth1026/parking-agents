interface:
  display_name: "orchestrate-worktree-loop"
  short_description: "只调度可见 Codex Desktop worker，监督证据并串行合并"
  default_prompt: "使用 $orchestrate-worktree-loop 仅作为 coordinator：为每个既有 worktree 创建或复用可见 Codex Desktop executor/reviewer session；worker 在目标 worktree 完成 Issue 实现、测试和 review，当前任务只负责监督、更新 tracker、验证事实并 merge。"
