<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>笔记统计 Mock（确认版 2026-08-07）</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: 1rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; background: #fafafa; }
  .card .label { font-size: .9rem; color: #666; }
  .card .num { font-size: 2.25rem; font-weight: 700; line-height: 1.2; }
  .row { display: flex; align-items: center; gap: .75rem; margin: .5rem 0; }
  .cat { width: 5em; text-align: right; flex: none; }
  .bar-wrap { flex: 1; background: #eee; border-radius: 4px; }
  .bar { background: #4a7cc7; color: #fff; padding: .15rem .5rem; font-size: .85rem; white-space: nowrap; border-radius: 4px; min-width: 1.5em; }
  .note { color: #777; font-size: .85rem; margin-top: 1.5rem; }
</style>
</head>
<body>
  <h1>笔记统计</h1>

  <!-- 用户确认点 2：页面顶部数字卡片，文案固定为「近 7 天新增」加数字（跨分类合计） -->
  <div class="card">
    <div class="label">近 7 天新增</div>
    <div class="num">3</div>
  </div>

  <h2>各分类笔记数</h2>
  <!-- 用户确认点 1：每个分类一条横向长条示意数量对比，长条内带数字，纯 CSS 实现，不引入图表库 -->
  <div class="row"><span class="cat">工作</span><div class="bar-wrap"><div class="bar" style="width:100%">12</div></div></div>
  <div class="row"><span class="cat">读书</span><div class="bar-wrap"><div class="bar" style="width:58%">7</div></div></div>
  <div class="row"><span class="cat">生活</span><div class="bar-wrap"><div class="bar" style="width:33%">4</div></div></div>
  <div class="row"><span class="cat">灵感</span><div class="bar-wrap"><div class="bar" style="width:17%">2</div></div></div>

  <!-- 关键状态：数据为空时页面显示「暂无笔记」，卡片数字为 0，不显示长条 -->
  <p class="note">
    示例数据为写死的演示值；真实页面按当前 data/notes.jsonl 统计，长条宽度与该分类数量成正比。
    统计页为新增页面（建议路径 /stats），与现有笔记列表页并存。
    视觉细节不要求像素一致，结构与内容以本 mock 为准（用户确认：2026-08-07）。
  </p>
</body>
</html>
