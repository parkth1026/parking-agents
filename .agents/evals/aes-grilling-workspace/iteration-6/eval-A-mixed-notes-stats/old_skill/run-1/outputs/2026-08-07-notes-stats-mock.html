<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>笔记统计（确认版 v2）</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  nav a { font-size: 13px; color: #555; }

  .card {
    margin-top: 20px;
    padding: 16px 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    display: inline-block;
  }
  .card .label { font-size: 13px; color: #666; }
  .card .value { font-size: 28px; font-weight: 600; margin-top: 4px; }

  .bars { margin-top: 28px; }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bar-row .name { width: 72px; flex-shrink: 0; font-size: 14px; }
  .bar-row .track {
    flex: 1;
    background: #eee;
    border-radius: 4px;
    height: 20px;
    position: relative;
  }
  .bar-row .fill {
    background: #4a7dfc;
    height: 100%;
    border-radius: 4px;
  }
  .bar-row .count {
    width: 36px;
    text-align: right;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <nav><a href="/">&larr; 返回笔记列表</a></nav>
  <h1>笔记统计</h1>

  <!-- 改动点 1（对照 v1）：新增顶部数字卡片，文案固定为「近 7 天新增」+ 数字 -->
  <div class="card">
    <div class="label">近 7 天新增</div>
    <div class="value">9</div>
  </div>

  <!-- 改动点 2（对照 v1）：分类统计从表格改为横向长条，长条自身带数字，不引入图表库（纯 CSS div 实现） -->
  <div class="bars">
    <div class="bar-row">
      <div class="name">工作</div>
      <div class="track"><div class="fill" style="width: 100%"></div></div>
      <div class="count">128</div>
    </div>
    <div class="bar-row">
      <div class="name">读书</div>
      <div class="track"><div class="fill" style="width: 50%"></div></div>
      <div class="count">64</div>
    </div>
    <div class="bar-row">
      <div class="name">生活</div>
      <div class="track"><div class="fill" style="width: 24%"></div></div>
      <div class="count">31</div>
    </div>
    <div class="bar-row">
      <div class="name">未分类</div>
      <div class="track"><div class="fill" style="width: 3%"></div></div>
      <div class="count">4</div>
    </div>
  </div>
</body>
</html>
