<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>笔记</title></head>
<body>
  <h1>我的笔记</h1>
  <ul id="notes"></ul>
  <script>
    fetch('/api/notes').then(r => r.json()).then(notes => {
      for (const note of notes) {
        const li = document.createElement('li');
        li.textContent = '[' + note.category + '] ' + note.text;
        document.getElementById('notes').append(li);
      }
    });
  </script>
</body>
</html>
