<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Insight Report Mock v1</title>
<style>
  :root{--bg:#1a1a2e;--bg2:#16213e;--fg:#e8e8f0;--accent:#4fc3f7;--card:#0f3460;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,sans-serif;}
  .header{padding:24px 32px;background:var(--bg2);}
  .header h1{margin:0 0 8px;}
  .section{padding:24px 32px;border-top:1px solid #2a2a4a;}
  .section h2{margin-top:0;}
  .facet-select{padding:6px 10px;border-radius:6px;background:var(--card);color:var(--fg);border:1px solid #345;}
  .empty-note{color:#999;font-style:italic;}
  .changed{outline:2px dashed #ffb74d;outline-offset:4px;}
  .bar{height:20px;background:var(--accent);border-radius:4px;margin:4px 0;}
</style>
</head>
<body>

<div class="header" id="sec-header">
  <h1>Insight Report — Mock v1</h1>
  <div class="subtitle">扫描日期: 2026-08-01 ~ 2026-08-13 &bull; Sessions: 42</div>
</div>

<!-- 改动点：下拉框塞在“总览”区块内部，紧跟在总览小结之后 -->
<div class="section changed" id="sec-glance">
  <h2>&#x1F52D; At a Glance</h2>
  <p>本周共 42 个 session，平均耗时 6.2 分钟。</p>

  <label>筛选 facet：
    <select class="facet-select" id="facetSelect">
      <option value="sec-dynamics">对话动力学</option>
      <option value="sec-agents">Agent 使用分布</option>
      <option value="sec-goals" selected>目标分布</option>
      <option value="sec-satisfaction">满意度分析</option>
      <option value="sec-narratives">叙事洞察</option>
    </select>
  </label>
</div>

<div class="section" id="sec-dynamics" data-facet>
  <h2>&#x1F504; 对话动力学总览</h2>
  <p>平均每个 session 4.3 轮对话。</p>
</div>

<div class="section" id="sec-agents" data-facet>
  <h2>&#x1F916; Agent 使用分布</h2>
  <p>主 Agent 占比 78%，子 Agent 占比 22%。</p>
</div>

<div class="section" id="sec-goals" data-facet>
  <h2>&#x1F3AF; 目标分布</h2>
  <div class="bar" style="width:60%"></div>
  <div>代码生成 60%</div>
  <div class="bar" style="width:30%"></div>
  <div>调试 30%</div>
</div>

<div class="section" id="sec-satisfaction" data-facet>
  <h2>&#x1F60A; 满意度分析</h2>
  <div class="bar" style="width:80%"></div>
  <div>满意 80%</div>
</div>

<div class="section" id="sec-narratives" data-facet>
  <h2>&#x1F4D6; 叙事洞察</h2>
  <p class="empty-note">这个 facet 暂无数据</p>
</div>

<script>
  var sel = document.getElementById('facetSelect');
  function apply() {
    document.querySelectorAll('[data-facet]').forEach(function(el){
      el.style.contentVisibility = (el.id === sel.value) ? 'visible' : 'hidden';
    });
  }
  sel.addEventListener('change', apply);
  apply();
</script>

</body>
</html>

<!--
用户意见（v1 → v2 需要改的两条）：

   不要放在任何一个 facet 区块里面。
2. 选中态没有明显的视觉反馈——只有原生 <select> 自己显示当前值，看不出「我现在在
   哪个 facet」；要在下拉框旁边把当前选中的 facet 名字高亮出来。
