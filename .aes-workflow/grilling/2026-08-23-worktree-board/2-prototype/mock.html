});
function applyFilter(){
  const lit=new Set(GN.filter(n=>n.status===FILTER).map(n=>n.num));
  focusSet(lit); lit.forEach(markLit);
}
/* 搜索（handoff 交互 5） */
document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const q=e.target.value.trim().toLowerCase(); if(!q)return;
  const w=WORKERS.find(w=>w.name.toLowerCase().includes(q));
  if(w&&w.at){ flyToNode(w.at); return; }
  const n=GN.find(n=>("#"+n.num).includes(q)||String(n.num)===q.replace("#","")||(n.title&&n.title.toLowerCase().includes(q)));
  if(n){ flyToNode(n.num); } else toast("未找到："+q);
});
addEventListener("keydown",e=>{ if(e.key==="Escape"){ LOCKED=false; FILTER=null;
  document.querySelectorAll(".lg.on").forEach(x=>x.classList.remove("on"));
  clearFocus(); closePanel(); closeModal(); }});

/* ============ 视图切换 ============ */
let VIEW="graph";
function showView(v){
  VIEW=v;
  document.getElementById("map-wrap").style.display = v==="lanes"?"block":"none";
  document.getElementById("graph-wrap").style.display = v==="graph"?"block":"none";
  document.getElementById("btn-lanes").classList.toggle("active",v==="lanes");
  document.getElementById("btn-graph").classList.toggle("active",v==="graph");
  document.getElementById("search").style.display = v==="graph"?"flex":"none";
  document.getElementById("legend").style.display = v==="graph"?"flex":"none";
  document.getElementById("zoomctl").style.display = v==="graph"?"flex":"none";
  document.getElementById("hint").style.display = v==="graph"?"block":"none";
  if(v==="graph") gFit(); else drawLaneEdges();
}

/* ============ 详情面板（handoff 浮动白卡；打开时盖住 dock）============ */
function openPanel(o,kind){
  const t=document.getElementById("ptitle"),g=document.getElementById("ptag"),b=document.getElementById("pbody");
  if(kind==="issue"){
    t.textContent = "#"+o.num;
    g.innerHTML = `<span class="pill ${o.status}">${STATUS_ZH[o.status]}</span>`;
    b.innerHTML = issuePanel(o);
  } else {
    t.textContent = o.name;
    g.innerHTML = o.mode!=="idle" ? `<span class="pill claimed">${MODE_ZH[o.mode]} · #${o.at}</span>` : `<span class="pill resolved">空闲</span>`;
    b.innerHTML = workerPanel(o);
  }
  document.getElementById("dock").style.display="none";
  document.getElementById("panel").classList.add("open");
  const d=document.getElementById("go-dirty"); if(d)d.onclick=()=>document.getElementById("modal").classList.add("show");
}
function unlocks(num){ return EDGES.filter(e=>e.from===num).map(e=>e.to); }
function issuePanel(i){
  const w = WORKERS.find(w=>w.at===i.num);
  const deps = (i.deps&&i.deps.length)
    ? i.deps.map(d=>`<span class="chip">#${d}${isClosed(d)?" ✓":" 未闭"}</span>`).join(" ")
    : '<span class="hint">无依赖</span>';
  const ul = unlocks(i.num);
  const unlockBlock = ul.length?`
    <div class="wash"><div class="cap">完成后解锁</div>
      <div class="chips">${ul.map(n=>`<span class="chip">#${n} ${byNum[n]?byNum[n].title.slice(0,8)+"…":""}</span>`).join("")}</div></div>`:"";
  const dispatch = i.status==="frontier" ? `
    <div class="sec-h">从这里派活</div>
    <textarea>按 #${i.num} 的验收标准实现，完成后 commit 带 (#${i.num})</textarea>
    <div class="row">
      <select><option>dev1（空闲）</option><option>dev2（空闲·2 未提交）</option><option>dev3（空闲·31 未提交⚠）</option></select>
      <select><option>claude</option><option>codex</option></select>
      <button class="primary" onclick="toast('mock：已派发 → #${i.num}')">派发</button></div>` : "";
  const btns = `
    <div class="row" style="margin-top:14px">
      ${w&&w.job?`<button class="primary" onclick="toast('mock：查看 ${w.name} 运行日志')">查看运行日志</button>`:""}
      <button onclick="toast('mock：打开 github issue #${i.num}')">打开 issue</button></div>`;
  return `
    <h2>${i.title}</h2>
    <div class="kv">
      <dt>状态</dt><dd>${STATUS_ZH[i.status]}${i.warn?' <span class="stale-badge">⚠ 回归有波动</span>':""}</dd>
      <dt>依赖</dt><dd>${deps}</dd>
      <dt>认领</dt><dd>${w?`<b>${w.name}</b>（${MODE_ZH[w.mode]}）`:"无人认领"}</dd>
      <dt>分支</dt><dd><b>${w?w.branch.split("@")[0]:"—"}</b></dd></div>
    ${unlockBlock}${dispatch}${btns}
    ${i.status==="resolved"?'<div class="hint" style="margin-top:10px">已关闭 issue 只读，不提供派发。</div>':""}`;
}
function workerPanel(w){
  const stale = w.stale?'<span class="stale-badge">已过期 — 事实晚于评估</span>':"";
  const assess = w.merge?`
    <div class="sec-h">主 Agent 评估</div><div class="assess">
      <div><span class="pill blocked">尚不建议合并</span>${stale}</div>
      <div style="margin-top:6px">${w.task}</div>
      <div style="margin-top:4px;color:var(--ink3)">${w.reason}</div>
      <div class="hint" style="margin-top:5px">评估于 ${w.assessedAt} · claude-main</div></div>`
    :'<div class="sec-h">主 Agent 评估</div><div class="hint">尚无评估——回主仓跑一次巡检</div>';
  const job = w.job?`
    <div class="hint">运行中 ${w.job.id} · agent: ${w.job.agent}</div>
    <pre class="log">${w.job.log}</pre>`
    :'<div class="hint">当前无运行中任务</div>';
  return `
    <h2>${w.name}</h2>
    <div class="kv">
      <dt>分支</dt><dd><b>${w.branch}</b></dd>
      <dt>相对 main</dt><dd>领先 ${w.ahead} · 落后 ${w.behind}</dd>
      <dt>未提交</dt><dd>${w.dirty?w.dirty+" 项 ⚠":"干净"}</dd>
      <dt>位置</dt><dd>${w.at?("#"+w.at):"未在场（无认领）"}</dd>
      <dt>轨迹</dt><dd>${w.trail.length?w.trail.map(t=>"#"+t).join(" → "):"—"}</dd></div>
    ${assess}
    <div class="sec-h">当前任务</div>${job}
    <div class="sec-h">派发新任务</div>
    <textarea placeholder="给 ${w.name} 的任务指令…"></textarea>
    <div class="row"><select><option>claude</option><option>codex</option><option>test</option></select>
      ${w.dirty>10?'<button class="primary" id="go-dirty">派发</button>':`<button class="primary" onclick="toast('mock：已派发 → ${w.name}')">派发</button>`}</div>
    ${w.dirty>10?'<div class="hint" style="margin-top:8px">该 worktree 有大量未提交改动，点派发会先弹确认</div>':""}`;
}
function closePanel(){ document.getElementById("panel").classList.remove("open"); document.getElementById("dock").style.display="flex"; }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800); }

showView("graph");
window.__mock={OPEN,CLOSED,WORKERS,EDGES,GN,gByNum,focusNode,focusWorker,showView,flyToNode,openPanel}; // 验收脚本入口
</script>
<!--
  ============ v4 相对 v3 的变更（基准：design_handoff_issue_starmap）============
  视觉整体切换为 handoff 纸面 tokens（米白 #FAF9F5、橙 #C15F3C、紫 #7C6BAE、Source Serif 4 / Archivo / IBM Plex Mono）
  图谱视图按 handoff 规格重做：星等=依赖度数半径公式、frontier 橙双晕、claimed 紫三层信标环（呼吸动画）、
    blocked 空心虚线圆、resolved 暗点、#31 回归警示琥珀虚线环、背景小星、贝塞尔弯曲边、阻塞链虚线、
    worker 名牌旗信标（紫 ▶ / 琥珀 ✋，任何淡出下名牌 op=1、claimed 节点最低 0.5）、
    hover 邻域高亮（150ms）、图例点击过滤、搜索定位飞行 450ms+闪烁、⌖ 定位、缩放 <60% 隐藏 resolved 标签
  新增（handoff 规格）：搜索框、图例计数卡、Workers 停靠面板（右上）、缩放控件（−/%/＋）、
    详情面板改为浮动白卡 340px（打开时盖住 dock）、「完成后解锁」灰底块、「查看运行日志」按钮
  整合裁决（待用户确认）：
    - 横排 worker 名册 → handoff 的 Workers 停靠面板替代（补 dirty/评估过期徽标）
    - 图谱中心「main 基地」按 handoff 砍掉（空闲 worker 由 dock 兜底，「未在场」）；轨迹保留在面板文字+聚焦点亮
    - ✋ 名牌文案用 v3 语义「手动推进」（handoff 写的是「等待确认」，语义待裁决）
    - 「打开 PR」→「打开 issue」（仓库无 PR 流程）
  保留自 v3：双视图切换（图谱为默认）、四列地图视图（纸面化重皮肤）、跨视图邻域聚焦同步、
    详情面板信息结构（Git 状态/评估/任务/派发）、dirty 弹层、评估过期标记、进度条
-->
