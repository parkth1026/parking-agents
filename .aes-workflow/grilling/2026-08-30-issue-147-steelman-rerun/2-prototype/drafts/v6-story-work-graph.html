function matches(n){

 if(state.filter==='frontier'&&!frontier(n))return false;
 if(state.filter==='blocked'&&!['BLOCKED','PENDING','DEGRADED','STALE'].includes(n.status))return false;

function path(a,b,edge){
 const w=204,h=102;
 if(edge.a==='SIM-WT-RUNTIME-CORE'&&edge.b==='SIM-GATE-RUNTIME-INTEGRATION')return 'M122 476 V502 H598 V476';
 if(b.y>a.y+105){const m=(a.y+h+b.y)/2;return 'M'+(a.x+w/2)+' '+(a.y+h)+' V'+m+' H'+(b.x+w/2)+' V'+b.y;}
 const x1=a.x+w,y1=a.y+h/2,x2=b.x,y2=b.y+h/2,m=(x1+x2)/2;
 return 'M'+x1+' '+y1+' H'+m+' V'+y2+' H'+x2;
}
